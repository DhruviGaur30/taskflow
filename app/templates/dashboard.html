{% extends "base.html" %}

{% block content %}

<h1 class="text-4xl font-bold mb-8 text-blue-600">
    Dashboard
</h1>

<div class="grid md:grid-cols-3 gap-6">

    <div class="bg-white rounded-xl shadow-lg p-6">

        <h2 class="text-xl font-semibold text-gray-700">
            Total Tasks
        </h2>

        <p class="text-5xl font-bold text-blue-600 mt-4">
            {{ total_tasks }}
        </p>

    </div>

    <div class="bg-yellow-100 rounded-xl shadow-lg p-6">

        <h2 class="text-xl font-semibold text-gray-700">
            Pending Tasks
        </h2>

        <p class="text-5xl font-bold text-yellow-600 mt-4">
            {{ pending_tasks }}
        </p>

    </div>

    <div class="bg-green-100 rounded-xl shadow-lg p-6">

        <h2 class="text-xl font-semibold text-gray-700">
            Completed Tasks
        </h2>

        <p class="text-5xl font-bold text-green-600 mt-4">
            {{ completed_tasks }}
        </p>

    </div>

</div>

{% endblock %}
